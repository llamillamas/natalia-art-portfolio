<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalia B. Llamas - Graphic Designer & Digital Illustrator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #222;
            line-height: 1.6;
        }
        
        header {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            width: 60px;
            height: 60px;
        }
        
        nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: #222;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #a07c8f;
        }
        
        .hero {
            padding: 4rem 0;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .hero p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1rem;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 3rem 0;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        
        .modal img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }
        
        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        footer {
            background: #f5f5f5;
            padding: 3rem 0;
            margin-top: 4rem;
            text-align: center;
            border-top: 1px solid #eee;
        }
        
        .social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }
        
        .social a {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: #222;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s;
            font-size: 1.2rem;
        }
        
        .social a:hover {
            background: #a07c8f;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <img src="public/images/logo.png" alt="Logo" class="logo">
                <nav>
                    <a href="#gallery">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <section class="hero">
                <h1>NATALIA B. LLAMAS</h1>
                <p>GRAPHIC DESIGNER & DIGITAL ILLUSTRATOR</p>
            </section>
            
            <section id="gallery" class="gallery">
                <div class="gallery-item" onclick="openModal('public/images/artwork-1.png')">
                    <img src="public/images/artwork-1.png" alt="Artwork 1" loading="lazy">
                </div>
                <div class="gallery-item" onclick="openModal('public/images/artwork-2.png')">
                    <img src="public/images/artwork-2.png" alt="Artwork 2" loading="lazy">
                </div>
                <div class="gallery-item" onclick="openModal('public/images/artwork-3.png')">
                    <img src="public/images/artwork-3.png" alt="Artwork 3" loading="lazy">
                </div>
                <div class="gallery-item" onclick="openModal('public/images/artwork-4.jpg')">
                    <img src="public/images/artwork-4.jpg" alt="Artwork 4" loading="lazy">
                </div>
                <div class="gallery-item" onclick="openModal('public/images/artwork-5.jpg')">
                    <img src="public/images/artwork-5.jpg" alt="Artwork 5" loading="lazy">
                </div>
            </section>
        </div>
    </main>
    
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close" onclick="closeModal()">&times;</button>
            <img id="modal-img" src="" alt="">
        </div>
    </div>
    
    <footer id="contact">
        <div class="container">
            <p>&copy; 2021 by Natalia Llamas</p>
            <div class="social">
                <a href="https://www.instagram.com/nbllamas_art/" target="_blank" title="Instagram">📷</a>
                <a href="https://www.linkedin.com/in/natalia-llamas-9b617b115/" target="_blank" title="LinkedIn">💼</a>
            </div>
        </div>
    </footer>
    
    <script>
        function openModal(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal(event) {
            if (event && event.target.id !== 'modal') return;
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
